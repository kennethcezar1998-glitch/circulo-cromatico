# Publica a versão web (circulo cromatico ativo .html) no GitHub Pages.
# O arquivo vira o index.html do site, então o endereço fica limpo:
# https://kennethcezar1998-glitch.github.io/circulo-cromatico/
name: Publicar versão web

on:
  push:
    branches: [master]
    paths:
      - 'circulo cromatico ativo .html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Montar o site
        run: |
          mkdir _site
          cp "circulo cromatico ativo .html" _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
