# Publica no GitHub Pages:
#   /          → versão web (circulo cromatico ativo .html vira o index.html)
#   /plugin/   → página do plugin com prévia interativa do painel
#   /plugin/painel/            → os arquivos de photoshop-plugin/
#   /plugin/como-instalar.html → o guia de instalação
# https://kennethcezar1998-glitch.github.io/circulo-cromatico/
name: Publicar site

on:
  push:
    branches: [master]
    paths:
      - 'circulo cromatico ativo .html'
      - 'photoshop-plugin/**'
      - 'site/**'
      - 'dist/COMO INSTALAR.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Montar o site
        run: |
          mkdir -p _site/plugin/painel
          cp "circulo cromatico ativo .html" _site/index.html
          cp -r site/. _site/
          cp -r photoshop-plugin/. _site/plugin/painel/
          cp "dist/COMO INSTALAR.html" _site/plugin/como-instalar.html
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
